name = "affi-post"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# 公開 URL は独自ドメインのサブドメインだけにする（workers.dev の URL はアカウント名が入るため無効化）
workers_dev = false
preview_urls = false
routes = [{ pattern = "affipo.kurashiapp.com", custom_domain = true, zone_name = "kurashiapp.com" }]

# アプリ本体（Expo の Web 書き出し = PWA）を同じドメインで配信する。/v1/* だけ Worker が処理する
[assets]
directory = "../dist"
not_found_handling = "single-page-application"
run_worker_first = ["/v1/*"]

[[d1_databases]]
binding = "DB"
database_name = "affi-post"
database_id = "26cfc97d-1577-47ab-ae9b-9d9b0c5ca436"

[vars]
# Claude のモデルと1回の生成で出力できる最大トークン数（= 1回あたりの最大原価を決める）
MODEL = "claude-sonnet-5-5"
MAX_OUTPUT_TOKENS = "3000"
# 月間の Claude API 費用上限（USD）。超えると翌月まで生成を止める。売れたら引き上げる
MONTHLY_BUDGET_USD = "20"
# Stripe の Payment Link ID = 付与回数。Stripe アカウントは他のアプリと共用するため、ここにある ID の決済だけを受け付ける
# お試し 10回 160円 / 定番 50回 480円 / たっぷり 120回 980円
STRIPE_LINKS = "plink_1UNevcRz7oqxshxk8Ngmo6th:10,plink_1UNeySRz7oqxshxkYqsT02hU:50,plink_1UNezBRz7oqxshxk3yRBTFU9:120"

# API をブラウザから呼んでよいサイト（カンマ区切り）。ローカル開発では .dev.vars で http://localhost:8081 を足す
ALLOWED_ORIGINS = "https://affipo.kurashiapp.com"

# リワード広告（広告を見たら無料で1回分）。Google Ad Manager の審査が通ってから "1" にする
AD_REWARD_ENABLED = "0"
# 広告何本で1回分か / 1端末・1IPあたり1日に受け取れる無料回数
AD_VIEWS_PER_CREDIT = "2"
AD_DAILY_GRANTS_PER_USER = "1"
AD_DAILY_GRANTS_PER_IP = "3"
# 視聴開始からこの秒数たたない完了報告は無効
AD_MIN_WATCH_SEC = "10"
# 無料回数で生成したときの Claude 費用の月間上限（USD）。約1,000円。超えたら翌月まで無料分を止める
FREE_MONTHLY_BUDGET_USD = "7"

# シークレットは `npx wrangler secret put <NAME>` で設定する（このファイルには書かない）
#   ANTHROPIC_API_KEY     … 販売者の Claude API キー
#   STRIPE_WEBHOOK_SECRET … Stripe Webhook の署名シークレット（whsec_...）
#   TOKEN_ENC_KEY         … 利用者の Threads トークンを暗号化する鍵（長いランダム文字列。変更すると全員が再接続になる）

# 予約投稿の実行（5分ごと）
[triggers]
crons = ["*/5 * * * *"]
